<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <form id="signup-form">
        <label for="first-name">First name :</label>
        <input type='text' id="first-name" name="first-name" required>

        <label for="last-name">Last name :</label>
        <input type='text' id="last-name" name="last-name" required>

        <label for="email">Enter email ID :</label>
        <input type='email' id="email" name="email" required>

        <label for="password">Enter password :</label>
        <input type='password' id="password" name="password" required>

        <label for="confirm-password">Confirm password :</label>
        <input type='password' id="confirm-password" name="confirm-password" required>

        <h2>Please enter your requirements below</h2>

        <label>Location</label>>

        <label for="budget">Select a budget range</label>
        <select id="budget" name="budget">
              <option value="">Budget range</option>
              <option value="low">10,000</option>
              <option value="medium">10,000-20,000</option>
              <option value="high">20,000-30,000</option>
              <option value="very-high">30,000-40,000</option>
              <option value="really-high">40,000-50,000</option>
        </select>

        <label for="move-in-date">Select a preferred lease time and move in date</label>
        <input type="date" id="move-in-date" name="move-in-date">

        <label for="room-type">Room type</label>
        <select id="room-type" name="room-type">
              <option value="">Select a type</option>
              <option value="shared">Shared room</option>
              <option value="private-shared-apt">Private room, shared apartment</option>
              <option value="studio">Studio</option>
        </select>

        <label>Gender preference</label>
        <div class="checks">
            <label><input type="radio" name="gender-pref" value="female"> Female</label>
            <label><input type="radio" name="gender-pref" value="male"> Male</label>
            <label><input type="radio" name="gender-pref" value="co"> Co</label>
            <label><input type="radio" name="gender-pref" value="no-preference" checked> No preference</label>
        </div>

        <label for="occupation">Select occupation</label>
        <select id="occupation" name="occupation">
            <option value="student">Student</option>
            <option value="working">Working professional</option>
        </select>

        <label>choose language preference</label>
        <div class="checks">
            <label><input type="checkbox" name="language" value="english"> English</label>
            <label><input type="checkbox" name="language" value="hindi"> Hindi</label>
            <label><input type="checkbox" name="language" value="marathi"> Marathi</label>
            <label><input type="checkbox" name="language" value="gujarati"> Gujarati</label>
            <label><input type="checkbox" name="language" value="bengali"> Bengali</label>
        </div>

        <label for="sleep">Choose sleep and work schedule</label>
        <select id="sleep" name="sleep">
              <option value="">Sleep schedule</option>
              <option value="night-owl">Night owl</option>
              <option value="early-bird">Early bird</option>
              <option value="chad">No preference</option>
        </select>

        <label for="chore-pref">chore preference</label>
        <select id="chore-pref" name="chore-pref">
              <option value="">No preference</option>
              <option value="schedule">Set schedule / rotation</option>
              <option value="asneeded">As-needed, no schedule</option>
        </select>

        <label for="diet">Dietary preference</label>
        <select id="diet" name="diet">
              <option value="">No preference</option>
              <option value="omnivore">No restrictions</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="crazy">Vegan</option>
              <option value="halal">Halal</option>
              <option value="kosher">Kosher</option>
        </select>

        <label>Select habits (smoking, etc)</label>
        <div class="checks">
            <label><input type="checkbox" name="habits" value="smoking"> Smoking okay</label>
            <label><input type="checkbox" name="habits" value="drinking"> Drinking okay</label>
            <label><input type="checkbox" name="habits" value="quiet-hours"> Keeps quiet hours</label>
        </div>

        <label for="guest-policy">guest policy</label>
        <select id="guest-policy" name="guest-policy">
              <option value="">No preference</option>
              <option value="rare">Rarely have guests over</option>
              <option value="occasional">Occasional guests, advance notice</option>
              <option value="frequent">Frequent guests are fine</option>
        </select>

        <label for="pet-tolerance">pet tolerance</label>
        <select id="pet-tolerance" name="pet-tolerance">
              <option value="">No preference</option>
              <option value="none">No pets</option>
              <option value="cats">Cats okay</option>
              <option value="dogs">Dogs okay</option>
              <option value="any">Any pets okay</option>
        </select>

        <label>Expected amenities</label>
        <div class="checks">
            <label><input type="checkbox" name="amenities" value="laundry"> In-unit laundry</label>
            <label><input type="checkbox" name="amenities" value="parking"> Parking</label>
            <label><input type="checkbox" name="amenities" value="ac"> A/C</label>
        </div>

        <button type='submit'>Submit</button>
    </form>
</body>
</html>
